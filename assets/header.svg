<svg width="900" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0"/>
      <stop offset="30%" stop-color="#667eea"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.35"/>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#667eea" stroke-width="0.5">
    <line x1="0" y1="56" x2="900" y2="56"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- Ambient glow blobs -->
  <ellipse cx="180" cy="140" rx="140" ry="90" fill="#667eea" opacity="0.06" filter="url(#softglow)"/>
  <ellipse cx="720" cy="140" rx="140" ry="90" fill="#06b6d4" opacity="0.06" filter="url(#softglow)"/>
  <ellipse cx="450" cy="140" rx="120" ry="70" fill="#a855f7" opacity="0.04" filter="url(#softglow)"/>

  <!-- Animated star dots -->
  <g fill="white">
    <circle cx="60" cy="40" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="220" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="230" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="180" r="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.8;0.35" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="160" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="25" r="1.3" opacity="0.45"><animate attributeName="opacity" values="0.45;0.9;0.45" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="255" r="1" opacity="0.3"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="260" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Top accent line -->
  <rect x="200" y="52" width="500" height="1" fill="url(#lineGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Main name -->
  <text
    x="450" y="138"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="-1.5"
    fill="url(#textGrad)"
    filter="url(#glow)">
    Shubham Mane
  </text>

  <!-- Bottom accent line -->
  <rect x="200" y="167" width="500" height="1" fill="url(#lineGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text
    x="450" y="207"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="18"
    font-weight="400"
    letter-spacing="4"
    fill="#94a3b8"
    opacity="0.9">
    CLOUD &amp; DEVOPS  ·  KUBERNETES  ·  TERRAFORM  ·  CI/CD
  </text>
</svg>