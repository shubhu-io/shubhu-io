<svg width="900" height="170" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="170" fill="url(#pbg)" rx="12" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Subtitle Header Bar -->
  <g transform="translate(24, 22)">
    <circle cx="6" cy="6" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="10" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">END-TO-END AUTOMATED DEVOPS &amp; CLOUD ARCHITECTURE</text>
    <text x="852" y="10" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">ZERO DOWNTIME</text>
  </g>

  <!-- Connecting Flow Line -->
  <line x1="85" y1="98" x2="815" y2="98" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Stage 1: Code & Commit -->
  <g transform="translate(24, 46)">
    <rect width="128" height="102" rx="8" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="128" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="64" y="22" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">01 · CODE</text>
    <text x="64" y="44" text-anchor="middle" font-size="20" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📝</text>
    <text x="64" y="66" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Git / GitHub</text>
    <text x="64" y="84" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Branch Strategy</text>
  </g>

  <!-- Stage 2: CI & Test -->
  <g transform="translate(168, 46)">
    <rect width="128" height="102" rx="8" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2"/>
    <rect width="128" height="3" rx="1.5" fill="#818cf8"/>
    <text x="64" y="22" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">02 · CI / CD</text>
    <text x="64" y="44" text-anchor="middle" font-size="20" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">⚙️</text>
    <text x="64" y="66" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">GH Actions</text>
    <text x="64" y="84" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Automated Tests</text>
  </g>

  <!-- Stage 3: Build & Image -->
  <g transform="translate(312, 46)">
    <rect width="128" height="102" rx="8" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.2"/>
    <rect width="128" height="3" rx="1.5" fill="#a855f7"/>
    <text x="64" y="22" text-anchor="middle" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">03 · ARTIFACT</text>
    <text x="64" y="44" text-anchor="middle" font-size="20" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🐳</text>
    <text x="64" y="66" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Docker &amp; ECR</text>
    <text x="64" y="84" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Multi-stage Build</text>
  </g>

  <!-- Stage 4: IaC -->
  <g transform="translate(456, 46)">
    <rect width="128" height="102" rx="8" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect width="128" height="3" rx="1.5" fill="#06b6d4"/>
    <text x="64" y="22" text-anchor="middle" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">04 · IAC</text>
    <text x="64" y="44" text-anchor="middle" font-size="20" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🏗️</text>
    <text x="64" y="66" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Terraform / IaC</text>
    <text x="64" y="84" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Ansible Config</text>
  </g>

  <!-- Stage 5: Deploy & GitOps -->
  <g transform="translate(600, 46)">
    <rect width="128" height="102" rx="8" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.2"/>
    <rect width="128" height="3" rx="1.5" fill="#10b981"/>
    <text x="64" y="22" text-anchor="middle" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">05 · GITOPS</text>
    <text x="64" y="44" text-anchor="middle" font-size="20" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">☸️</text>
    <text x="64" y="66" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">K8s &amp; ArgoCD</text>
    <text x="64" y="84" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">AWS EKS Cluster</text>
  </g>

  <!-- Stage 6: Observe -->
  <g transform="translate(744, 46)">
    <rect width="128" height="102" rx="8" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="128" height="3" rx="1.5" fill="#f59e0b"/>
    <text x="64" y="22" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">06 · MONITOR</text>
    <text x="64" y="44" text-anchor="middle" font-size="20" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📈</text>
    <text x="64" y="66" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Prometheus</text>
    <text x="64" y="84" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Grafana Alerting</text>
  </g>
</svg>
